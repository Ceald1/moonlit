<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">
<head>
  {{ partial "head.html" . }}
<link rel="stylesheet" href="{{ "css/colors.css" | absLangURL }}">
<link rel="stylesheet" href="{{ "css/style.css" | absLangURL }}">
<link rel="stylesheet" href="{{ "css/mobile.css" | absLangURL }}">

<link rel="stylesheet" href="{{ "css/search.css" | absLangURL }}">
      {{ with .OutputFormats.Get "rss" }}
  {{ printf `<link rel=%q type=%q href=%q title=%q>` .Rel .MediaType.Type .Permalink site.Title | safeHTML }}
{{ end }}
</head>
<body>
<script src="https://unpkg.com/lucide@latest"></script>

  <header>
    {{ partial "header.html" . }}
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    {{ partial "footer.html" . }}
  </footer>

<script>
  lucide.createIcons();
</script>
{{ if .Store.Get "hasMermaid" }}
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true,
theme: 'base',
    themeVariables: {
    background: '#1e1e2e',
    primaryColor: '#89b4fa',
    primaryTextColor: '#cdd6f4',
    primaryBorderColor: '#b4befe',
    lineColor: '#9399b2',
    secondaryColor: '#f5c2e7',
    tertiaryColor: '#f9e2af',
    nodeBkg: '#313244',
    nodeBorder: '#cba6f7',
    clusterBkg: '#181825',
    clusterBorder: '#45475a',
    titleColor: '#f5e2af',
    edgeLabelBackground: '#313244',
    textColor: '#cdd6f4'
  }
    });
  </script>
{{ end }}
</body>
</html>
